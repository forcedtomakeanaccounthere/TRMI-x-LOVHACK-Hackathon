name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: 22
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  lint-typecheck:
    name: Lint and typecheck (JS)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # The Python service is checked in its own job below.
      - run: npx turbo run lint typecheck --filter='!@linkroom/ai'

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # The Python service's tests run in the ai job below, which has uv.
      - run: npx turbo run test:unit --filter='!@linkroom/ai'

  # Database (pgTAP), integration and e2e tests share one real local Supabase, started once.
  supabase:
    name: Database, integration and e2e tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      # The Supabase CLI comes from devDependencies. Applies supabase/migrations and supabase/config.toml.
      # Services the tests don't use are skipped to start faster.
      - run: npx supabase start -x realtime,imgproxy,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - name: Database tests (RLS)
        run: npm run test:db
      - name: Integration tests
        run: npm run test:integration
      # Builds the backend, starts dist/index.js in production mode and runs the account journey.
      - name: E2E tests
        run: npm run test:e2e

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build

  ai:
    name: AI service (ruff, pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/ai
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: apps/ai/uv.lock
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run pytest

  # Single required check for branch protection: passes only if every job above passed.
  ci-passed:
    name: CI passed
    if: always()
    needs: [lint-typecheck, unit, supabase, build, ai]
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
      - run: echo "All checks passed"
